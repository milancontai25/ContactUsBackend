<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>Ramsam Trends | Business Solutions & Services</title>

    <meta
      name="description"
      content="Ramsam Trends provides business solutions, products, services, compliance support and useful resources for businesses."
    />

    <meta
      name="keywords"
      content="Ramsam Trends, business solutions, business services, compliance, products, services"
    />

    <meta name="author" content="Ramsam Trends" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Ramsam Trends | Business Solutions & Services"
    />

    <meta
      property="og:description"
      content="Explore Ramsam Trends business solutions, products, services and compliance resources."
    />

    <meta
      property="og:site_name"
      content="Ramsam Trends"
    />

    <meta
      property="og:image"
      content="https://www.ramsamtrends.com/og-image.png"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Ramsam Trends | Business Solutions & Services"
    />

    <meta
      name="twitter:description"
      content="Explore Ramsam Trends business solutions, products, services and compliance resources."
    />

    <meta
      name="twitter:image"
      content="https://www.ramsamtrends.com/og-image.png"
    />

    <!-- Performance -->
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
